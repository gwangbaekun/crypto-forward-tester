# Fade 전략 설정 — 모든 튜닝 수치는 이 파일에서만 관리한다.
# 코드는 값을 하드코딩하지 않고 여기서 필수 조회하며, 키가 없으면 부팅 시 즉시 터진다(fail-fast).

enabled: true

# ── 실시간 엔진 타이밍 ────────────────────────────────────────────────────────
sweep_interval_sec: 30       # 주기 루프: 구독 갱신 + 타임아웃 청산 체크 (감지 주기 아님)
throttle_s: 1.0              # 토큰당 최소 처리 간격 — 초당 수백 WS 업데이트를 1회/이 값으로 제한
ws_heartbeat_sec: 30         # WS 연결 하트비트
ws_reconnect_s: 5            # WS 오류 후 재연결 대기
ws_idle_sleep_s: 10          # 구독 종목이 하나도 없을 때 대기
ws_shard_size: 500           # WS 연결 1개당 구독 토큰 수 상한 — 넘기면 샤딩(연결 분할)
                             # 실측: subscribe 프레임 64KB 한계(토큰당 81B). 800개=63.3KB에서
                             # 에러 없이 커버리지만 0.9%로 붕괴한다. 500개는 100% 확인.
seed_interval: "1h"          # 재시작 직후 버퍼 시드용 REST 히스토리 간격
seed_points: 120             # 시드로 채울 최근 포인트 수
lookback_buffer_s: 300       # mid 버퍼 보관 여유 (lookback_s 초과분 — 이만큼 더 오래 보관)

# ── 진입 스파이크 감지 (하위 TF: 10분봉·10분창·+30%. btc_backtest 백테스트로 검증) ──────
lookback_s: 600              # 상대/절대 변동 판정 기준 창(초)
spike_rel: 1.30              # lookback 전 대비 +30%
spike_abs: 0.015             # AND 절대 +1.5¢
p0_lo: 0.005                 # 진입 대상 p0(기준가) 하한
p0_hi: 0.5                   # 진입 대상 p0 상한

# ── 청산 (백테스트 검증: 진입 129 · 승률 105/129 · 평균 10.4% · 최악 -20%) ──────────
# 순회 기준 — 되돌림을 끝까지 기다리지 않고 잘라서 슬롯을 비운다.
# 백테스트(자본 제약 있는 시간축 시뮬): 되돌림까지 붙잡으면 신호 2,584건 중 2,455건(95%)을
# 버린다. 잘라내고 순회하면 진입이 129 → 2,446건으로 늘고 MDD 는 −45% → −4% 로 준다.
retrace_pct: 0.50            # 스파이크 폭의 50% 되돌리면 청산
timeout_hours: 24.0          # 24h 내 미도달 시 강제 청산 → 슬롯 반납
stop_loss_pct: 0.10          # 손실 -10% 도달 시 즉시 손절

# ── 피라미딩 add-on: 열린 포지션에 새 스파이크가 더 오르면 추가 진입 → 평단·SL 라인 상향 ──
addon_enabled: true
addon_max_count: 2           # 포지션당 최대 add-on 횟수(초기 진입 제외 → 최대 3레그)
addon_min_rise_pct: 0.15     # 직전 레그 진입가 대비 +15% 더 올라야 add (10분창 매틱 폭주 방지)

# ── 사이징 · 순회 ─────────────────────────────────────────────────────────────
# full  = 진입마다 가용 pUSD 전액 → 사실상 동시 1포지션 (기존 동작)
# slots = 가용 pUSD ÷ 남은 슬롯 → max_concurrent 개까지 동시 보유 (순회)
# fixed = order_size_usd 고정. 잔액이 모자라면 진입을 접는다.
order_size_mode: slots
max_concurrent: 3            # 동시 보유 상한. full 모드에선 무시(항상 1)
order_size_usd: 1.0          # fixed 모드 명목 / 릴레이 미설정(시뮬) 시 fallback
balance_buffer: 0.98         # 전액의 98%만 진입(수수료·최소단위·슬리피지 여유)

# ── 순회용 가드 ───────────────────────────────────────────────────────────────
# 만기가 코앞인 진입은 되돌아올 시간 자체가 없다.
# 백테스트 실측: 만기 30일 이내 진입 제외 시 MDD p95 −18.2% → −12.2%.
min_days_left: 30

# 호가창이 비면 API/WS 가 중간값(0.50)을 흘린다. 백테스트 실측으로 5배 이상 점프
# 스파이크 359건 중 138건(38%)이 이 가짜였다. 단발 급변은 다음 틱이 확인해줄 때까지
# 버퍼에 넣지 않는다 — 진입이 한 틱 늦어지는 대신 유령 스파이크를 막는다.
glitch_filter: true

# ── 슬롯 교체 ─────────────────────────────────────────────────────────────────
# 슬롯이 찼는데 새 신호가 오면, 오래 물려 있고 아직 이익이 아닌 포지션을 정리하고
# 갈아탄다. 회전이 이 전략의 전부라 '안 움직이는 포지션이 슬롯을 잡고 있는 것' 이
# 제일 비싸다. 단, 수익이 나고 있으면 되돌림이 진행 중이라는 뜻이라 건드리지 않는다.
# 기준은 **남은 먹을 것 비교**다. 이익 중이어도 판다 — 목표까지 얼마 안 남은 포지션이
# 슬롯을 잡고 있는 것보다, 더 크게 되돌릴 새 신호로 옮기는 게 회전의 취지다.
#   열린 포지션 남은 수익 = (현재가 − 목표가) / (1 − 진입가)
#   새 신호 기대 수익     = retrace × (진입가 − 기준가) / (1 − 진입가)
replace_enabled: true
replace_min_age_h: 1.0       # 이보다 어린 포지션은 교체 대상 아님 (초 단위 갈아치우기 방지)
replace_min_gain_ratio: 1.5  # 새 신호가 기존 '남은 수익' 의 이 배 이상이어야 갈아탄다

# ── 자본 회수 ─────────────────────────────────────────────────────────────────
# 실측(2026-08-14): DB 열린 포지션 0건인데 지갑에는 $32.77 이 4건에 묶여 있고 현금은
# $0.14 였다. 엔진은 포지션이 없다고 믿고 계속 진입을 시도했고, 주문은 전부
# 'not enough balance' 로 거부되며 초당 0.7건씩 무한 재시도가 돌았다.
#
# reconcile — 부팅/주기적으로 지갑 실보유를 읽어 DB 와 맞춘다. 체인에 있는데 DB 에
#             없으면 복구(avgPrice 로 진입가 복원), DB 에 있는데 체인에 없으면 유령 정리.
# raise_cash — 진입 금액이 최소 주문액에 못 미치면 보유분을 팔아 현금을 만든다.
#              파는 순서는 '평가손익이 좋은 것부터' — 이익이 났다는 건 되돌림이 이미
#              진행돼 남은 먹을 것이 적다는 뜻이라 기회비용이 가장 작다.
reconcile_enabled: true
min_order_usd: 5.0           # 폴리마켓 최소 주문액. 이 아래면 주문해봐야 거부된다.
raise_cash_enabled: true

# 방금 판 종목을 되사지 않는 시간. 0 이면 끔.
# 실측 문제: 현금 확보로 X 를 팔았는데 X 가 여전히 스파이크 조건을 만족해서
# 그 현금으로 X 를 다시 샀다. 수수료만 나가고 자본은 제자리, 결국 처음 4종목을
# 계속 되사는 순환이 됐다.
reentry_cooldown_h: 6

# 텔레그램 — 상태 알림(지갑 동기화·현금 확보 등 내부 사정)은 기본으로 막는다.
# 순회 구조에서는 이런 게 쏟아져 정작 봐야 할 체결 알림을 덮는다.
# 체결(진입/청산/add-on)은 이 값과 무관하게 항상 보낸다.
telegram_status_alerts: false

# ── 백테스트(/fade/sim)에서만 사용 — live 엔진은 재진입 허용으로 쿨다운 미사용 ──────────
cooldown_hours: 12           # sim 순차 백테스트의 같은 마켓 재진입 간격

# ── 워치리스트 자동 스크리너 — 이름이 아니라 가격 거동으로 종목을 뽑는다 ──────────────
# 전수 열거 원리와 실측치는 screener.py / _data/client.py:screen_band_markets 주석 참조.
screener:
  enabled: true
  interval_hours: 1            # 스캔 주기. 실측 1회 26s/58요청이라 1h면 부하 무시 가능
  band_lo: 0.05                # 밴드 하한 — "5~15%대에 머무는" 종목
  band_hi: 0.15                # 밴드 상한
  min_volume_usd: 10000        # 볼륨 하한. $10k 기준 밴드 후보 941개(실측)
  dwell_ratio_min: 0.70        # 최근 곡선의 70% 이상이 밴드 안에 머물러야 편입
  min_spikes: 1                # 같은 구간에 스파이크 1회 이상
  history_fidelity: 10         # 검증 곡선 봉 간격(분) — 라이브 lookback_s=600 과 정렬
  history_concurrency: 20      # 곡선 병렬 수집. 실측 59 req/s, 429 0건
  months_ahead: 18             # 종료월 슬라이스 범위. 이후는 롱테일 한 덩어리
  auto_include: true           # 통과분을 included 로 자동 편입
  auto_drop: true              # 밴드 이탈분을 자동 구독 해제(열린 포지션은 예외)
  # 스크리너 스파이크 판정 — 라이브 진입 조건과 같은 값으로 맞춰둔다.
  # 여기를 라이브(lookback_s/spike_rel/spike_abs)와 다르게 두면
  # "편입은 됐는데 진입은 영영 안 되는" 종목이 쌓인다.
  spike_lookback_s: 600
  spike_rel: 1.30
  spike_abs: 0.015
  spike_cooldown_hours: 12
