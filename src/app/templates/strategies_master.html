<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategies Master</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 600; color: #e6edf3; }
    .header-sub {
      font-size: 12px;
      color: #7d8590;
      font-family: "SF Mono", "Fira Code", monospace;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-enabled { background: #1a4731; color: #3fb950; border: 1px solid #238636; }
    .badge-total   { background: #161b22; color: #7d8590;  border: 1px solid #30363d; }
    .badge-ro      { background: #161b22; color: #7d8590;  border: 1px solid #30363d; }

    .layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }

    .sidebar {
      width: 290px;
      flex-shrink: 0;
      background: #161b22;
      border-right: 1px solid #21262d;
      overflow-y: auto;
      padding: 10px 0 20px;
    }
    .sidebar-section {
      padding: 12px 14px 5px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #7d8590;
      font-weight: 600;
    }
    .strategy-item {
      padding: 7px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border-left: 3px solid transparent;
      transition: background .12s;
    }
    .strategy-item:hover { background: #1c2128; }
    .strategy-item.active {
      background: #1c2128;
      border-left-color: #388bfd;
      color: #e6edf3;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-on  { background: #3fb950; }
    .dot-off { background: #484f58; }
    .strategy-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .strategy-emoji { font-size: 14px; flex-shrink: 0; }
    .strategy-open {
      flex-shrink: 0;
      color: #58a6ff;
      text-decoration: none;
      font-size: 12px;
      padding: 0 3px;
      opacity: .65;
    }
    .strategy-open:hover { opacity: 1; }
    .strategy-nolink { flex-shrink: 0; color: #484f58; font-size: 12px; padding: 0 3px; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .detail {
      background: #161b22;
      border-bottom: 1px solid #21262d;
      padding: 10px 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 46px;
    }
    .detail-key {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      color: #e6edf3;
    }
    .meta {
      font-size: 11.5px;
      color: #7d8590;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 2px 7px;
      font-family: "SF Mono", "Fira Code", monospace;
    }
    .meta-live { color: #f0883e; border-color: #5a3a1a; }
    .link-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #58a6ff;
      text-decoration: none;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 3px 10px;
      transition: background .12s, border-color .12s;
    }
    .link-chip:hover { background: #1c2128; border-color: #388bfd; }
    .link-chip code {
      color: #7d8590;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
    }
    .detail-empty { font-size: 12px; color: #484f58; }
    .detail-spacer { margin-left: auto; }

    .toolbar {
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .toolbar-file {
      font-size: 12.5px;
      color: #7d8590;
      font-family: "SF Mono", "Fira Code", monospace;
    }
    .toolbar-file span { color: #c9d1d9; }

    .btn {
      padding: 4px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: #c9d1d9;
      border: 1px solid #30363d;
      transition: background .15s;
    }
    .btn:hover:not(:disabled) { background: #1c2128; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    #yaml-wrap { flex: 1; overflow: hidden; }
    #yaml-view {
      width: 100%;
      height: 100%;
      background: #0d1117;
      color: #8b949e;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.6;
      border: none;
      outline: none;
      resize: none;
      padding: 16px 20px;
      tab-size: 2;
    }
    #yaml-view::selection { background: #1f6feb55; color: #e6edf3; }

    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,.5);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 100;
      background: #da3633;
      color: #fff;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="header">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="flex-shrink:0">
    <rect width="20" height="20" rx="5" fill="#238636"/>
    <path d="M5 7h10M5 10h7M5 13h8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  </svg>
  <div>
    <div class="header-title">Strategies Master</div>
    <div class="header-sub" id="header-path">—</div>
  </div>
  <div class="header-actions">
    <span class="badge badge-ro">read-only</span>
    <span class="badge badge-enabled" id="badge-enabled">— enabled</span>
    <span class="badge badge-total"   id="badge-total">— total</span>
    <a href="/" style="color:#58a6ff;text-decoration:none;font-size:12.5px;">← Index</a>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div style="padding:12px 14px;font-size:12px;color:#484f58">로딩 중…</div>
  </div>

  <div class="main">
    <div class="detail" id="detail">
      <span class="detail-empty">전략을 선택하세요</span>
    </div>

    <div class="toolbar">
      <div class="toolbar-file">src/features/strategy/common/<span>strategies_master.yaml</span></div>
      <div style="margin-left:auto">
        <button class="btn" id="btn-reload">↺ Reload</button>
      </div>
    </div>

    <div id="yaml-wrap">
      <textarea id="yaml-view" readonly spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const view       = document.getElementById('yaml-view');
  const sidebar    = document.getElementById('sidebar');
  const detail     = document.getElementById('detail');
  const toast      = document.getElementById('toast');
  const btnReload  = document.getElementById('btn-reload');
  const badgeEna   = document.getElementById('badge-enabled');
  const badgeTot   = document.getElementById('badge-total');
  const headerPath = document.getElementById('header-path');

  let strategies = [];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function renderSidebar() {
    if (!strategies.length) {
      sidebar.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:#484f58">전략 없음</div>';
      return;
    }

    const groups = [
      ['enabled', strategies.filter(s => s.enabled)],
      ['disabled', strategies.filter(s => !s.enabled)],
    ];

    sidebar.innerHTML = groups.map(([name, list]) => {
      if (!list.length) return '';
      const rows = list.map(s => {
        const primary = s.pages.length ? s.pages[0].path : '';
        const open = primary
          ? `<a class="strategy-open" href="${esc(primary)}" target="_blank" rel="noopener"
                onclick="event.stopPropagation()" title="${esc(primary)}">↗</a>`
          : '<span class="strategy-nolink" title="바인딩된 페이지 없음">·</span>';
        return `
          <div class="strategy-item" data-key="${esc(s.key)}">
            <div class="dot ${s.enabled ? 'dot-on' : 'dot-off'}"></div>
            <span class="strategy-emoji">${esc(s.emoji || '•')}</span>
            <span class="strategy-label" title="${esc(s.key)}">${esc(s.label)}</span>
            ${open}
          </div>`;
      }).join('');
      return `<div class="sidebar-section">${name} · ${list.length}</div>${rows}`;
    }).join('');

    sidebar.querySelectorAll('.strategy-item').forEach(el => {
      el.addEventListener('click', () => select(el.dataset.key));
    });
  }

  function renderDetail(s) {
    if (!s) {
      detail.innerHTML = '<span class="detail-empty">전략을 선택하세요</span>';
      return;
    }

    const metas = [];
    if (s.symbol) metas.push(`<span class="meta">${esc(s.symbol)}</span>`);
    if (s.timeframes.length) metas.push(`<span class="meta">${esc(s.timeframes.join(' · '))}</span>`);
    metas.push(`<span class="meta">enabled: ${s.enabled}</span>`);
    metas.push(`<span class="meta">monitoring: ${s.monitoring}</span>`);
    if (s.binance_live) metas.push('<span class="meta meta-live">binance_live</span>');
    if (s.ctrader_live) metas.push('<span class="meta meta-live">ctrader_live</span>');
    if (s.base !== s.key) metas.push(`<span class="meta">base: ${esc(s.base)}</span>`);

    const links = s.pages.length
      ? s.pages.map(p => `
          <a class="link-chip" href="${esc(p.path)}" target="_blank" rel="noopener">
            ${esc(p.label)} <code>${esc(p.path)}</code>
          </a>`).join('')
      : '<span class="detail-empty">바인딩된 페이지 없음</span>';

    detail.innerHTML = `
      <span class="detail-key">${esc(s.emoji)} ${esc(s.key)}</span>
      ${metas.join('')}
      <span class="detail-spacer"></span>
      ${links}`;
  }

  function scrollToKey(key) {
    const lines = view.value.split('\n');
    let charPos = 0;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith(key + ':')) {
        view.focus();
        view.setSelectionRange(charPos, charPos + lines[i].length);
        const lineH = parseFloat(getComputedStyle(view).lineHeight) || 22;
        view.scrollTop = Math.max(0, i * lineH - 120);
        return;
      }
      charPos += lines[i].length + 1;
    }
  }

  function select(key) {
    const s = strategies.find(x => x.key === key);
    sidebar.querySelectorAll('.strategy-item').forEach(el => {
      el.classList.toggle('active', el.dataset.key === key);
    });
    renderDetail(s);
    if (s) scrollToKey(key);
  }

  async function load() {
    btnReload.disabled = true;
    try {
      const res = await fetch('/api/strategies-master', { headers: { 'Accept': 'application/json' } });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || `HTTP ${res.status}`);
      strategies = data.strategies || [];
      view.value = data.content || '';
      headerPath.textContent = data.path || '';
      badgeEna.textContent = `${data.enabled} enabled`;
      badgeTot.textContent = `${data.total} total`;
      renderSidebar();
      renderDetail(null);
    } catch (err) {
      showToast('로드 실패: ' + err.message);
    } finally {
      btnReload.disabled = false;
    }
  }

  btnReload.addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
