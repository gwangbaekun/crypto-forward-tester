<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Scan — Forward Test</title>
<link rel="stylesheet" href="/static/css/dashboard_common.css">
<style>
  body.vs-app {
    padding: 10px 12px 24px;
  }

  .app-shell {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .top-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .market-filter {
    flex-shrink: 0;
    display: flex;
    gap: 6px;
    padding: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .mfilter-btn {
    flex: 1;
    min-width: 0;
    padding: 6px 14px;
    font-size: 0.75rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .mfilter-btn.active { background: rgba(88,166,255,0.15); color: var(--blue); }
  .mfilter-btn[data-market="kospi"].active { background: rgba(74,144,217,0.18); color: #4a90d9; }
  .mfilter-btn[data-market="nasdaq"].active { background: rgba(163,113,247,0.18); color: #a371f7; }

  .ctrl-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .ctrl-row .scan-info { font-size: 0.72rem; color: var(--text-secondary); margin-left: auto; }

  .main-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .tab-bar {
    flex-shrink: 0;
    display: flex;
    gap: 4px;
    padding: 0 10px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    padding: 8px 14px;
    font-size: 0.78rem;
    font-weight: 600;
    border: none;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  .table-scroll {
    overflow-x: auto;
    padding: 0 4px 8px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.76rem; }
  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--card);
    text-align: left;
    padding: 6px 8px;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th.r, td.r { text-align: right; }
  tbody tr { border-bottom: 1px solid rgba(48,54,61,0.45); }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody td {
    padding: 5px 8px;
    color: var(--text-primary);
    white-space: nowrap;
  }
  td.muted { color: var(--text-secondary); font-size: 0.72rem; }
  td.name {
    font-weight: 600;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 0.67rem;
    font-weight: 700;
  }
  .badge-buy  { background: rgba(63,185,80,0.15);  color: #3fb950; }
  .badge-sell { background: rgba(248,81,73,0.15);  color: #f85149; }
  .badge-hold { background: rgba(139,148,158,0.12); color: #8b949e; }

  .scan-filter-bar {
    display: flex;
    gap: 8px;
    padding: 8px 12px 4px;
    align-items: center;
    flex-wrap: wrap;
  }
  .scan-filter-btn {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.68rem;
    font-weight: 600;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .scan-filter-btn.active { border-color: var(--blue); color: var(--blue); background: rgba(88,166,255,0.1); }
  .scan-date { font-size: 0.68rem; color: var(--text-secondary); margin-left: auto; }
  .score-bar-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 90px;
  }
  .score-bar-bg {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width .3s;
  }
  .score-hi  .score-bar-fill { background: #3fb950; }
  .score-mid .score-bar-fill { background: #d29922; }
  .score-lo  .score-bar-fill { background: #f85149; }
  .score-num {
    font-size: 0.72rem;
    font-weight: 700;
    min-width: 22px;
    text-align: right;
  }
  .score-hi  .score-num { color: #3fb950; }
  .score-mid .score-num { color: #d29922; }
  .score-lo  .score-num { color: #f85149; }
  .score-na  { font-size: 0.72rem; color: var(--text-secondary); }

  .scan-main-row { cursor: pointer; }
  .scan-main-row:hover td { background: rgba(255,255,255,0.03); }
  .scan-detail-row { display: none; }
  .scan-detail-row.open { display: table-row; }
  .scan-detail-row td {
    padding: 10px 14px;
    background: rgba(22,27,34,0.9);
    border-bottom: 1px solid var(--border);
  }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px 14px;
  }
  .detail-item { display: flex; flex-direction: column; gap: 2px; }
  .detail-label {
    font-size: 0.64rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--text-secondary);
  }
  .detail-value {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
  }
  .detail-value.pos { color: #3fb950; }
  .detail-value.neg { color: #f85149; }
  .detail-value.warn { color: #d29922; }
  .detail-score-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .dscore-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 5px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    min-width: 60px;
  }
  .dscore-chip .dsc-label { font-size: 0.6rem; color: var(--text-secondary); text-transform: uppercase; }
  .dscore-chip .dsc-val { font-size: 0.9rem; font-weight: 700; }
  .dscore-chip.hi .dsc-val { color: #3fb950; }
  .dscore-chip.mid .dsc-val { color: #d29922; }
  .dscore-chip.lo .dsc-val { color: #f85149; }
  .detail-sell-reason {
    font-size: 0.72rem;
    color: #f85149;
    margin-top: 6px;
    padding: 4px 8px;
    border-radius: 4px;
    background: rgba(248,81,73,0.1);
    display: inline-block;
  }

  .scan-section-hdr td {
    padding: 8px 8px 3px;
    font-size: 0.63rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
  }
  tr.row-buy  { background: rgba(63,185,80,0.03); }
  tr.row-sell { background: rgba(248,81,73,0.03); }

  .per-low  { color: #3fb950; font-weight: 600; }
  .per-high { color: #f85149; }
  .dash { color: #444d56; }

  #scan-spinner { display: none; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    text-align: center;
    padding: 28px;
    color: var(--text-secondary);
    font-size: 0.82rem;
  }

  .act-inner {
    padding: 10px 12px 16px;
    overflow-x: auto;
  }
  .act-summary {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--text-secondary);
  }
  .star { color: #d29922; margin-right: 2px; }
  .row-famous { outline: 1.5px solid rgba(210,153,34,0.6); outline-offset: -1px; background: rgba(210,153,34,0.05) !important; }
</style>
</head>
<body class="vs-app">
<div class="app-shell">

  <div class="top-row">
    <div class="header-left">
      <span class="strategy-tag">Value Scan</span>
      <span class="symbol-badge" id="header-market-label">NASDAQ / S&amp;P 500</span>
      <span class="status-dot" id="dot" style="background:#444d56"></span>
    </div>
    <a href="/" class="back">← Home</a>
  </div>

  <div class="market-filter" id="market-filter">
    <button type="button" class="mfilter-btn active" data-market="nasdaq" onclick="setMarketFilter('nasdaq', this)">
      NASDAQ / S&amp;P
    </button>
    <button type="button" class="mfilter-btn" data-market="kospi" onclick="setMarketFilter('kospi', this)">
      KOSPI
    </button>
  </div>

  <div class="ctrl-row">
    <span class="ctrl-label">Scan</span>
    <button class="primary" onclick="triggerScan('nasdaq')">▶ Scan NASDAQ</button>
    <button onclick="triggerScan('kospi')">Scan KOSPI</button>
    <span id="scan-spinner"><span class="spinner"></span></span>
    <span class="scan-info" id="scan-info">—</span>
  </div>

  <main class="main-panel">
    <div class="tab-bar">
      <button type="button" class="tab-btn" onclick="switchTab('activity', this)">Activity</button>
      <button type="button" class="tab-btn active" onclick="switchTab('scan', this)">Scan Results</button>
      <a href="/quant/value_scan/mobile/dashboard" class="tab-btn" style="text-decoration:none;margin-left:auto;font-size:.72rem;color:var(--blue)">📱 Mobile</a>
    </div>

    <div class="tab-pane" id="tab-activity">
      <div class="act-inner">
        <div class="act-summary">
          <span id="act-date">—</span>
          <span style="color:var(--border)">|</span>
          <span>Scanned: <b id="act-scanned">—</b></span>
          <span style="color:var(--border)">|</span>
          <span style="color:#3fb950">BUY: <b id="act-buy">—</b></span>
          <span style="color:var(--border)">|</span>
          <span style="color:#f85149">SELL: <b id="act-sell">—</b></span>
        </div>
      </div>
    </div>

    <div class="tab-pane active" id="tab-scan">
      <div class="scan-filter-bar">
        <button class="scan-filter-btn active" onclick="setScanFilter('all',this)">All</button>
        <button class="scan-filter-btn" onclick="setScanFilter('BUY',this)">▲ BUY</button>
        <button class="scan-filter-btn" onclick="setScanFilter('SELL',this)">▼ SELL</button>
        <button class="scan-filter-btn" onclick="setScanFilter('HOLD',this)">HOLD</button>
        <span class="scan-date" id="scan-results-date">—</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Signal</th><th>Score</th><th>Symbol</th><th>Name</th><th>Sector</th>
              <th class="r">PER</th><th class="r">Median</th><th class="r">Ratio</th>
              <th class="r">EPS</th><th class="r">Fwd EPS</th><th class="r">PBR</th>
            </tr>
          </thead>
          <tbody id="scan-results-tbody">
            <tr><td colspan="11" class="empty">Scan Results 탭 클릭 시 최신 스캔 데이터 로드</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

</div>

<script>
const BASE = "/quant/value_scan";
let pollTimer = null;
let marketFilter = "nasdaq";
let scanResultsData = { kospi: null, nasdaq: null };
let scanFilter = "all";

async function safeFetch(url) {
  const r = await fetch(url);
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`${r.status} ${txt.slice(0, 120)}`);
  }
  return r.json();
}

function switchTab(name, btn) {
  document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
  btn.classList.add("active");
  if (name === "scan") loadScanResults();
}

function marketLabel() {
  return marketFilter === "kospi" ? "KOSPI 200" : "NASDAQ / S&P 500";
}

function setMarketFilter(market, btn) {
  marketFilter = market;
  document.querySelectorAll(".mfilter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("header-market-label").textContent = marketLabel();
  if (document.getElementById("tab-scan").classList.contains("active")) renderScanResults();
}

function formatScanLine(market, meta, win) {
  if (!meta?.last_scan_at_local) {
    const need = win?.needs_scan_today ? " · due" : "";
    return `${market.toUpperCase()}: not today${need}`;
  }
  return `${market.toUpperCase()}: ${meta.last_trading_date} ${meta.last_scan_at_local.split(" ")[1] || ""}`;
}

function applyScanMeta(d) {
  if (!d) return;
  const dot = document.getElementById("dot");
  dot.style.background = d.running ? "#d29922" : "#3fb950";
  const info = document.getElementById("scan-info");
  const markets = d.markets || {};
  const wins = d.windows || {};
  const k = formatScanLine("kospi", markets.kospi, wins.kospi);
  const n = formatScanLine("nasdaq", markets.nasdaq, wins.nasdaq);
  const srv = d.server_kst ? ` · now KST ${d.server_kst.split(" ")[1]}` : "";
  info.textContent = `${k} | ${n}${srv}`;
  if (wins[marketFilter]?.needs_scan_today && wins[marketFilter]?.past_window) {
    info.textContent += " · scan due";
  }
}

async function loadActivity() {
  let d;
  try { d = await safeFetch(`${BASE}/activity`); } catch { return; }
  if (!d || !d.date) return;

  document.getElementById("act-date").textContent = `Scan date: ${d.date}`;
  document.getElementById("act-scanned").textContent = d.scanned ?? "—";
  document.getElementById("act-buy").textContent = d.buy ?? "—";
  document.getElementById("act-sell").textContent = d.sell ?? "—";
}

async function triggerScan(market) {
  const spinner = document.getElementById("scan-spinner");
  const info = document.getElementById("scan-info");
  spinner.style.display = "inline";
  info.textContent = "Scanning…";
  document.getElementById("dot").style.background = "#d29922";

  try {
    const r = await fetch(`${BASE}/scan?market=${market}`, { method: "POST" });
    const d = await r.json();
    if (d.error) {
      info.textContent = d.error;
      spinner.style.display = "none";
      return;
    }
    info.textContent = "Scan started…";
    pollScanStatus();
  } catch (e) {
    info.textContent = `Error: ${e}`;
    spinner.style.display = "none";
  }
}

function pollScanStatus() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const d = await safeFetch(`${BASE}/scan/status`);
    if (!d.running) {
      clearInterval(pollTimer);
      document.getElementById("scan-spinner").style.display = "none";
      scanResultsData = { kospi: null, nasdaq: null };
      await Promise.all([loadActivity(), refreshScanStatus()]);
      if (document.getElementById("tab-scan").classList.contains("active")) loadScanResults();
    }
  }, 3000);
}

async function refreshScanStatus() {
  try {
    const s = await safeFetch(`${BASE}/scan/status`);
    applyScanMeta(s);
    return s;
  } catch (e) {
    console.error("scan status", e);
    return null;
  }
}

function toggleScanDetail(id) {
  const row = document.getElementById(id);
  if (!row) return;
  row.classList.toggle("open");
}

function setScanFilter(rating, btn) {
  scanFilter = rating;
  document.querySelectorAll(".scan-filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderScanResults();
}

function scoreHtml(r) {
  const s = r.score;
  if (s == null) return '<span class="score-na">—</span>';
  const cls = s >= 65 ? "score-hi" : s >= 45 ? "score-mid" : "score-lo";
  const pct = Math.min(s, 100);
  return `<div class="score-bar-wrap ${cls}">
    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pct}%"></div></div>
    <span class="score-num">${s}</span>
  </div>`;
}

function dchipCls(v, max) {
  const ratio = v / max;
  return ratio >= 0.65 ? "hi" : ratio >= 0.4 ? "mid" : "lo";
}

function fmtPct(v, decimals = 1) {
  if (v == null || isNaN(v)) return "—";
  const cls = v >= 0 ? "pos" : "neg";
  return `<span class="detail-value ${cls}">${v >= 0 ? "+" : ""}${Number(v).toFixed(decimals)}%</span>`;
}
function fmtRaw(v, decimals = 1, suffix = "") {
  if (v == null || isNaN(v)) return `<span class="detail-value" style="color:var(--text-secondary)">—</span>`;
  return `<span class="detail-value">${Number(v).toFixed(decimals)}${suffix}</span>`;
}
function fmtDe(v) {
  if (v == null || isNaN(v)) return `<span class="detail-value" style="color:var(--text-secondary)">—</span>`;
  const cls = v < 0 ? "pos" : v < 80 ? "pos" : v < 150 ? "warn" : "neg";
  return `<span class="detail-value ${cls}">${Number(v).toFixed(0)}%</span>`;
}
function fmtRec(v) {
  if (v == null || isNaN(v)) return `<span class="detail-value" style="color:var(--text-secondary)">—</span>`;
  const labels = ["", "Strong Buy", "Buy", "Hold", "Sell", "Strong Sell"];
  const cls = v <= 2 ? "pos" : v <= 3 ? "warn" : "neg";
  const label = labels[Math.round(v)] || "";
  return `<span class="detail-value ${cls}">${Number(v).toFixed(1)} <small style="font-weight:400">${label}</small></span>`;
}
function fmtFcf(v) {
  if (v == null || isNaN(v)) return `<span class="detail-value" style="color:var(--text-secondary)">—</span>`;
  const cls = v > 0 ? "pos" : "neg";
  const abs = Math.abs(v);
  const disp = abs >= 1e9 ? `$${(abs/1e9).toFixed(1)}B` : abs >= 1e6 ? `$${(abs/1e6).toFixed(0)}M` : `$${abs.toFixed(0)}`;
  return `<span class="detail-value ${cls}">${v < 0 ? "−" : ""}${disp}</span>`;
}

function sellReasonHtml(r) {
  const reasons = [];
  if (r.d_e != null && r.d_e > 400) reasons.push(`D/E ${r.d_e.toFixed(0)}% > 400% (재무위험)`);
  if (r.roe != null && r.roe < -15) reasons.push(`ROE ${r.roe.toFixed(1)}% < −15% (지속 적자)`);
  if (r.score_health != null && r.score_health <= 4) reasons.push(`Health 점수 ${r.score_health}/20 (재무건전성 미달)`);
  if (r.score != null && r.score <= 28) reasons.push(`Composite 점수 ${r.score}/100 ≤ 28`);
  if (!reasons.length) return "";
  return `<div class="detail-sell-reason">⚠ SELL 사유: ${reasons.join(" · ")}</div>`;
}

function detailRowHtml(r, colspan) {
  const hasScore = r.score != null;
  const scoreChips = hasScore ? `
    <div class="detail-score-row">
      <div class="dscore-chip ${dchipCls(r.score_valuation,30)}">
        <span class="dsc-label">Valuation</span>
        <span class="dsc-val">${r.score_valuation ?? "—"}<small style="font-weight:400;font-size:.65rem">/30</small></span>
      </div>
      <div class="dscore-chip ${dchipCls(r.score_quality,30)}">
        <span class="dsc-label">Quality</span>
        <span class="dsc-val">${r.score_quality ?? "—"}<small style="font-weight:400;font-size:.65rem">/30</small></span>
      </div>
      <div class="dscore-chip ${dchipCls(r.score_health,20)}">
        <span class="dsc-label">Health</span>
        <span class="dsc-val">${r.score_health ?? "—"}<small style="font-weight:400;font-size:.65rem">/20</small></span>
      </div>
      <div class="dscore-chip ${dchipCls(r.score_growth,15)}">
        <span class="dsc-label">Growth</span>
        <span class="dsc-val">${r.score_growth ?? "—"}<small style="font-weight:400;font-size:.65rem">/15</small></span>
      </div>
    </div>` : "";

  const fields = [
    ["ROE",          fmtPct(r.roe)],
    ["ROA",          fmtPct(r.roa)],
    ["Op. Margin",   fmtPct(r.op_margin)],
    ["Net Margin",   fmtPct(r.net_margin)],
    ["D/E Ratio",    fmtDe(r.d_e)],
    ["Current Ratio",fmtRaw(r.current_ratio, 2)],
    ["Free Cash Flow",fmtFcf(r.fcf)],
    ["Rev Growth",   fmtPct(r.rev_growth)],
    ["EPS Growth",   fmtPct(r.eps_growth)],
    ["EV/EBITDA",    fmtRaw(r.ev_ebitda, 1, "×")],
    ["PER",          fmtRaw(r.per, 1, "×")],
    ["Fwd PER",      fmtRaw(r.forward_per, 1, "×")],
    ["PBR",          fmtRaw(r.pbr, 2, "×")],
    ["Div Yield",    fmtPct(r.div)],
    ["Analyst Rec",  fmtRec(r.analyst_rec)],
    ["Target Upside",fmtPct(r.target_upside)],
  ];

  const grid = fields.map(([label, val]) =>
    `<div class="detail-item"><span class="detail-label">${label}</span>${val}</div>`
  ).join("");

  return `<tr class="scan-detail-row">
    <td colspan="${colspan}">
      ${scoreChips}
      <div class="detail-grid">${grid}</div>
      ${r.rating === "SELL" ? sellReasonHtml(r) : ""}
    </td>
  </tr>`;
}

function renderScanResults() {
  const tb = document.getElementById("scan-results-tbody");
  const data = scanResultsData[marketFilter];
  if (!data) {
    tb.innerHTML = `<tr><td colspan="11" class="empty">No scan data for ${marketFilter.toUpperCase()}. Run a scan first.</td></tr>`;
    return;
  }
  const rows = data.rows.filter(r => scanFilter === "all" || r.rating === scanFilter);
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="11" class="empty">No ${scanFilter} signals</td></tr>`;
    return;
  }
  const order = { BUY: 0, SELL: 1, HOLD: 2 };
  const isNasdaq = marketFilter === "nasdaq";
  rows.sort((a, b) => {
    if (a.rating !== b.rating) return (order[a.rating] ?? 3) - (order[b.rating] ?? 3);
    if (isNasdaq && a.score != null && b.score != null) return b.score - a.score;
    return (a.per ?? 999) - (b.per ?? 999);
  });
  const labels = { BUY: "── BUY", SELL: "── SELL", HOLD: "── HOLD" };
  const fmtN = v => v == null ? '<span class="dash">—</span>' : Number(v).toFixed(1);
  const fmtI = v => v == null ? '<span class="dash">—</span>' : Number(v).toLocaleString();
  const isKospi = !isNasdaq;
  const NCOLS = 11;
  let html = "", lastRating = null, rowIdx = 0;
  for (const r of rows) {
    if (r.rating !== lastRating) {
      lastRating = r.rating;
      html += `<tr class="scan-section-hdr"><td colspan="${NCOLS}">${labels[r.rating] || r.rating}</td></tr>`;
    }
    const med = r.sector_median;
    const ratio = (r.per != null && med != null) ? (r.per / med).toFixed(2) : null;
    const ratioCls = ratio != null ? (ratio < 1 ? "per-low" : "per-high") : "";
    const badge = r.rating === "BUY"
      ? '<span class="badge badge-buy">▲ BUY</span>'
      : r.rating === "SELL"
      ? '<span class="badge badge-sell">▼ SELL</span>'
      : '<span class="badge badge-hold">HOLD</span>';
    const famousCls = r.is_famous ? " row-famous" : "";
    const famousStar = r.is_famous ? '<span class="star" title="Famous watchlist">★</span>' : "";
    const detailId = `scan-detail-${rowIdx}`;
    html += `<tr class="row-${r.rating.toLowerCase()}${famousCls} scan-main-row" onclick="toggleScanDetail('${detailId}')">
      <td>${badge}</td>
      <td>${scoreHtml(r)}</td>
      <td><b>${r.symbol}</b></td>
      <td class="name muted">${famousStar}${r.name}</td>
      <td class="muted" style="max-width:140px;overflow:hidden;text-overflow:ellipsis">${r.sector || "—"}</td>
      <td class="r ${r.rating === "BUY" ? "per-low" : ""}">${fmtN(r.per)}</td>
      <td class="r muted">${fmtN(med)}</td>
      <td class="r ${ratioCls}">${ratio ?? '<span class="dash">—</span>'}</td>
      <td class="r muted">${isKospi ? fmtI(r.eps) : fmtN(r.eps)}</td>
      <td class="r muted">${isKospi ? fmtI(r.forward_eps) : fmtN(r.forward_eps)}</td>
      <td class="r muted">${fmtN(r.pbr)}</td>
    </tr>`;
    html += detailRowHtml(r, NCOLS).replace('class="scan-detail-row"', `class="scan-detail-row" id="${detailId}"`);
    rowIdx++;
  }
  tb.innerHTML = html;
}

async function loadScanResults() {
  const market = marketFilter;
  if (scanResultsData[market]) { renderScanResults(); return; }
  const tb = document.getElementById("scan-results-tbody");
  tb.innerHTML = `<tr><td colspan="10" class="empty">Loading…</td></tr>`;
  try {
    const d = await safeFetch(`${BASE}/scan/results?market=${market}`);
    scanResultsData[market] = d;
    document.getElementById("scan-results-date").textContent = d.date ? `Scan: ${d.date}` : "—";
    renderScanResults();
  } catch (e) {
    tb.innerHTML = `<tr><td colspan="10" class="empty">Load failed: ${e.message}</td></tr>`;
  }
}

async function init() {
  await Promise.all([loadActivity(), loadScanResults()]);
  const s = await refreshScanStatus();
  if (s?.running) {
    document.getElementById("scan-spinner").style.display = "inline";
    pollScanStatus();
  }
  setInterval(refreshScanStatus, 60000);
}

init();
</script>
</body>
</html>
